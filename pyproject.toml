[project]
name = "proton"
version = "0.2.0"
license = "MIT"
description = "Proton: local decision-model MCP server over small ONNX Runtime int8 encoders (SkillRet-Edge, e5-base-v2, GLiClass)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "huggingface-hub",
    "mcp>=1.2,<2",
    "numpy>=2.5.3",
    "onnxruntime",
    "psutil>=7.2.2",
    "tokenizers",
]

[dependency-groups]
# only scripts/export_onnx.py needs these; the server never imports them
export = [
    "gliclass",
    "onnx",
    "onnx-ir",
    "optimum[onnxruntime]",
    "torch",
    "transformers",
]

[project.scripts]
proton = "proton.server:main"

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proton"]
